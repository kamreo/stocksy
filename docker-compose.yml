services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: stocksy
      POSTGRES_PASSWORD: stocksy
      POSTGRES_DB: stocksy
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "stocksy"]
      interval: 3s
      retries: 10

  backend:
    build: { context: ., dockerfile: docker/Dockerfile }
    environment:
      DATABASE_URL: postgresql://stocksy:stocksy@db:5432/stocksy
      BETTER_AUTH_SECRET: dev-only-secret-change-me-0123456789
      BETTER_AUTH_URL: http://localhost:5000
    command: sh -c "pnpm exec prisma generate && pnpm exec prisma migrate deploy && pnpm start:dev"
    working_dir: /app/backend
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: { context: ., dockerfile: docker/Dockerfile }
    environment:
      API_URL: http://backend:3000
    command: pnpm dev
    working_dir: /app/frontend
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html
    ports: ["5000:5173"]
    depends_on: [backend]

volumes:
  pgdata:
