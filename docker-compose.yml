services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: stocksy
      POSTGRES_PASSWORD: stocksy
      POSTGRES_DB: stocksy
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "stocksy"]
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "pnpm install && pnpm exec prisma generate && pnpm exec prisma db push && pnpm start:dev"
    environment:
      DATABASE_URL: postgresql://stocksy:stocksy@db:5432/stocksy
    ports: ["3000:3000"]
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: sh -c "pnpm install && pnpm dev"
    environment:
      API_URL: http://backend:3000
    ports: ["5000:5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [backend]

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:
